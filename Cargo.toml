[package]
name = "tourvisor-vk-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# default-features = false: без openssl, TLS через rustls — не нужны системные libssl-dev/pkg-config
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"
futures = "0.3.32"
# default-features = false + ab_glyph: текст рендерится чисто растовым стеком,
# без системных fontconfig/freetype; шрифт вшит в бинарь (assets/DejaVuSans.ttf)
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "chrono", "ab_glyph", "all_series", "all_elements", "full_palette"] }
image = "0.25.10"
