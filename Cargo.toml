[package]
name = "tourvisor-vk-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
dotenvy = "0.15"
rand = "0.8"
futures = "0.3.32"
plotters = "0.3.7"
image = "0.25.10"
